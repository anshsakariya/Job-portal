{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JobSeeker</title>
    <link rel="stylesheet" href="{% static 'login_registration.css' %}?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <div class="brand-badge">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to access your dashboard & session profile</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'' }}">

        <div class="form-group">
            <label class="form-label">Email, Phone, or Username</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user-check"></i>
                <input 
                    type="text" 
                    name="username" 
                    class="input-field" 
                    placeholder="Enter your email, phone, or username" 
                    value="{{ remembered_username }}" 
                    required 
                    autofocus
                >
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-key"></i>
                <input 
                    type="password" 
                    id="passwordInput" 
                    name="password" 
                    class="input-field" 
                    placeholder="Enter your password" 
                    required
                >
                <button type="button" class="password-toggle" onclick="togglePassword()">
                    <i id="eyeIcon" class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-options">
            <label class="remember-checkbox">
                <input type="checkbox" name="remember_me" {% if remembered_username %}checked{% endif %}>
                <span>Remember me</span>
                <span class="cookie-badge"><i class="fa-solid fa-cookie-bite"></i> Cookie</span>
            </label>
        </div>

        <button type="submit" class="submit-btn">
            <span>Sign In to Portal</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="auth-switch">
            Don't have an account? 
            <a href="{% url 'register' %}"><strong>Register Here</strong></a>
            <div>
                <a href="{% url 'welcome' %}" class="back-home">
                    <i class="fa-solid fa-house"></i> Back to Homepage
                </a>
            </div>
        </div>
    </form>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}
</script>

</body>
</html>
